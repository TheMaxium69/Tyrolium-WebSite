<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tyrolium Theme Relay</title>
</head>
<body>
<!--
  Page relay pour la sync de thème cross-domaine.
  Hébergée sur tyrolium.fr, intégrée en iframe invisible sur les autres sites.
  Communication via postMessage.

  Ajouter les nouveaux domaines ici ET dans :
  projects/tyrolium-ui/src/lib/configs/tyro-ui-domains.ts
-->
<script>
(function () {
  var KEY = 'tyrolium-theme';
  var MODES = ['auto', 'light', 'dark'];
  var ALLOWED = [
    'https://tyrolium.fr',
    'https://solidserv.fr',
    'https://tyrociel.fr',
    'https://gamenium.fr',
    'https://influnias.fr',
    'https://vturias.fr',
    'https://nexiumiacrm.fr',
    'https://useritium.fr',
  ];

  function isAllowed(origin) {
    return ALLOWED.indexOf(origin) !== -1 || origin.indexOf('http://localhost') === 0;
  }

  function currentMode() {
    var v = localStorage.getItem(KEY);
    return (v && MODES.indexOf(v) !== -1) ? v : 'auto';
  }

  function notifyParent(type) {
    window.parent.postMessage({ type: type, mode: currentMode() }, '*');
  }

  // Écoute les changements de localStorage depuis d'autres onglets (même origine tyrolium.fr)
  window.addEventListener('storage', function (e) {
    if (e.key === KEY && e.newValue && MODES.indexOf(e.newValue) !== -1) {
      notifyParent('tyro-theme-changed');
    }
  });

  // Écoute les ordres de changement venant du site parent
  window.addEventListener('message', function (e) {
    if (!isAllowed(e.origin)) return;
    var data = e.data;
    if (data && data.type === 'tyro-theme-set' && MODES.indexOf(data.mode) !== -1) {
      localStorage.setItem(KEY, data.mode);
    }
  });

  // Au chargement : signale au parent le thème actuellement stocké sur tyrolium.fr
  notifyParent('tyro-theme-init');
})();
</script>
</body>
</html>
