<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tyrolium Relay</title>
</head>
<body>
<!--
  Page relay pour la sync cross-domaine (thème + langue + auth).
  Hébergée sur tyrolium.fr, intégrée en iframe invisible sur les autres sites.
  Communication via postMessage.

  Pour ajouter un domaine :
  1. Ajouter ici dans ALLOWED
  2. Ajouter dans projects/tyrolium-ui/src/lib/configs/tyro-ui-domains.ts
-->
<script>
(function () {
  var SYNC_KEYS = [
    'tyrolium-theme',
    'tyrolium-lang',
    'tyrolium-token',
    'tyrolium-user',
    'tyrolium-logout',    // timestamp de la dernière déconnexion
    'tyrolium-login-at',  // timestamp du dernier login (pour comparer avec logout)
  ];
  var ALLOWED = [
    'https://tyrolium.fr',
    'https://solidserv.fr',
    'https://tyrociel.fr',
    'https://gamenium.fr',
    'https://influnias.fr',
    'https://vturias.fr',
    'https://nexiumiacrm.fr',
    'https://useritium.fr',
    'https://tyroserv.fr'
  ];

  function isAllowed(origin) {
    return ALLOWED.indexOf(origin) !== -1 || origin.indexOf('http://192.168.1.81') === 0;
  }

  // Écoute les changements et suppressions depuis d'autres onglets (même origine tyrolium.fr)
  window.addEventListener('storage', function (e) {
    if (!e.key || SYNC_KEYS.indexOf(e.key) === -1) return;
    // e.newValue est null quand la clé est supprimée → on envoie '' pour signaler la suppression
    window.parent.postMessage({
      type: 'tyro-relay-changed',
      key: e.key,
      value: e.newValue !== null ? e.newValue : ''
    }, '*');
  });

  // Écoute les ordres du site parent
  window.addEventListener('message', function (e) {
    if (!isAllowed(e.origin)) return;
    var d = e.data;
    if (!d) return;
    if (d.type === 'tyro-relay-set' && d.key && d.value) {
      if (SYNC_KEYS.indexOf(d.key) !== -1) {
        localStorage.setItem(d.key, d.value);
      }
    } else if (d.type === 'tyro-relay-remove' && d.key) {
      if (SYNC_KEYS.indexOf(d.key) !== -1) {
        localStorage.removeItem(d.key);
      }
    }
  });

  // Au chargement : envoie toutes les valeurs stockées au parent
  var data = {};
  SYNC_KEYS.forEach(function (k) {
    var v = localStorage.getItem(k);
    if (v) data[k] = v;
  });
  window.parent.postMessage({ type: 'tyro-relay-init', data: data }, '*');
})();
</script>
</body>
</html>
