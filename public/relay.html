<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tyrolium Relay</title>
</head>
<body>
<!--
  Page relay pour la sync cross-domaine (thème + langue + auth).
  Hébergée sur tyrolium.fr, intégrée en iframe invisible sur les autres sites.
  Communication via postMessage.

  Stockage : document.cookie (SameSite=None; Secure) au lieu de localStorage.
  Chrome 115+ partitionne le localStorage des iframes cross-origin — les cookies
  SameSite=None contournent ce cloisonnement et restent accessibles en third-party.
  Safari (ITP) bloque les cookies third-party : pas de sync cross-domaine sur Safari.

  Pour ajouter un domaine :
  1. Ajouter ici dans ALLOWED
  2. Ajouter dans projects/tyrolium-ui/src/lib/configs/tyro-ui-domains.ts
-->
<script>
(function () {
  var SYNC_KEYS = [
    'tyrolium-theme',
    'tyrolium-lang',
    'tyrolium-token',
    'tyrolium-user',
    'tyrolium-logout',
    'tyrolium-login-at',
  ];
  var ALLOWED = [
    'https://tyrolium.fr',
    'https://solidserv.fr',
    'https://tyrociel.fr',
    'https://gamenium.fr',
    'https://influnias.fr',
    'https://vturias.fr',
    'https://nexiumiacrm.fr',
    'https://useritium.fr',
    'https://tyroserv.fr',
    'https://dashboard.useritium.fr'
  ];

  function isAllowed(origin) {
    return ALLOWED.indexOf(origin) !== -1 || origin.indexOf('http://192.168.1.81') === 0;
  }

  // --- Helpers cookie (SameSite=None; Secure pour accès cross-site) ---

  function getCookie(name) {
    var escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var match = document.cookie.match(new RegExp('(?:^|; )' + escaped + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }

  function setCookie(name, value) {
    document.cookie = name + '=' + encodeURIComponent(value) + '; SameSite=None; Secure; path=/; max-age=2592000';
  }

  function removeCookie(name) {
    document.cookie = name + '=; SameSite=None; Secure; path=/; max-age=0';
  }

  function getAllState() {
    var data = {};
    SYNC_KEYS.forEach(function (k) {
      var v = getCookie(k);
      if (v !== null) data[k] = v;
    });
    return data;
  }

  // --- Polling pour détecter les changements depuis d'autres onglets ---
  // Remplace l'event `storage` qui ne fire plus en contexte cross-origin partitionné.

  var lastSeen = {};
  SYNC_KEYS.forEach(function (k) { lastSeen[k] = getCookie(k); });

  setInterval(function () {
    SYNC_KEYS.forEach(function (key) {
      var current = getCookie(key);
      if (current !== lastSeen[key]) {
        lastSeen[key] = current;
        window.parent.postMessage({
          type: 'tyro-relay-changed',
          key: key,
          value: current !== null ? current : ''
        }, '*');
      }
    });
  }, 1500);

  // --- Écoute les ordres du site parent ---

  window.addEventListener('message', function (e) {
    if (!isAllowed(e.origin)) return;
    var d = e.data;
    if (!d) return;

    if (d.type === 'tyro-relay-set' && d.key && d.value) {
      if (SYNC_KEYS.indexOf(d.key) !== -1) {
        setCookie(d.key, d.value);
        lastSeen[d.key] = d.value;
      }
    } else if (d.type === 'tyro-relay-remove' && d.key) {
      if (SYNC_KEYS.indexOf(d.key) !== -1) {
        removeCookie(d.key);
        lastSeen[d.key] = null;
      }
    } else if (d.type === 'tyro-relay-refresh') {
      window.parent.postMessage({ type: 'tyro-relay-init', data: getAllState() }, '*');
    }
  });

  // --- Au chargement : envoie toutes les valeurs stockées au parent ---

  window.parent.postMessage({ type: 'tyro-relay-init', data: getAllState() }, '*');
})();
</script>
</body>
</html>
