<a class="project-card"
   [class.project-card--sub]="isSubProject"
   [class.project-card--h]="horizontal"
   [href]="project.link"
   [target]="project.link.startsWith('http') ? '_blank' : '_self'"
   [attr.rel]="project.link.startsWith('http') ? 'noopener noreferrer' : null">

  <div class="project-card__visual">
    <div class="project-card__logo-wrap">
      <img class="project-card__logo project-card__logo--light"
           [src]="project.imageLight || project.image"
           [alt]="project.name"
           [class.auto-white]="!project.imageLight">
      <img class="project-card__logo project-card__logo--color"
           [src]="project.image"
           [alt]="project.name">
    </div>
  </div>

  <div class="project-card__body">
    <div class="project-card__title-row">
      <h3>{{ project.name }}</h3>
      @if (!horizontal && !noSubProject && project.subItems?.length) {
        <button
          class="sub-toggle"
          [class.sub-toggle--open]="expanded"
          (click)="$event.stopPropagation(); $event.preventDefault(); toggleSub.emit()">
          <i class="ri-arrow-right-s-line"></i>
        </button>
      } @else if (!horizontal) {
        <i class="ri-arrow-right-up-line project-arrow"></i>
      }
    </div>
    <p>{{ lang() === 'en' ? (project.descriptionEn ?? project.description) : project.description }}</p>
  </div>

  @if (horizontal) {
    <div class="project-card__action">
      <i class="ri-arrow-right-up-line"></i>
    </div>
  }

</a>
